short_bio: >-
  <p>
    I am an undergraduate student in Computer Science at Tsinghua University.
    In Prof. Huaping Liu's group, I work on robot learning and vision-language-action policies.
    My recent work includes <em>TimelyDAgger</em>, on the timing of expert intervention,
    and <em>CSDW</em>, on learning from command–state discrepancies.
  </p>
  <p>
    Previously, I worked with Ranjay Krishna's group at the University of Washington
    on <em>PerceptionComp</em>, an ECCV 2026 benchmark for perception-centric reasoning over long videos.
  </p>

